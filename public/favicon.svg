<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="24" fill="#0D0D0D"/>
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="#2A2A2A" stroke-width="2"/>
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D2E" />
      <stop offset="50%" stop-color="#FF790F" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Stylized CampusRide "C" curved road emblem -->
  <path d="M 68 25 C 42 22 24 38 24 54 C 24 70 42 82 66 79 C 74 78 80 74 80 74 C 74 76 64 76 56 73 C 44 69 36 61 36 52 C 36 43 45 34 60 33 C 70 32 76 35 78 37 C 78 37 74 26 68 25 Z" fill="url(#orangeGrad)" filter="url(#glow)"/>
  <!-- Road perspective streaks -->
  <path d="M 33 60 C 44 61 58 54 74 46" stroke="#0D0D0D" stroke-width="3" stroke-linecap="round"/>
  <path d="M 45 57 L 51 54" stroke="#FFE6CC" stroke-width="2" stroke-linecap="round"/>
  <path d="M 57 51 L 63 48" stroke="#FFE6CC" stroke-width="2" stroke-linecap="round"/>
</svg>